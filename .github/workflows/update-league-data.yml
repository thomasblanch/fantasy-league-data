name: Update Fantasy League Data

# Runs daily and can also be triggered manually from the Actions tab
# with the "Run workflow" button.
on:
  schedule:
    # 6:00pm Sydney time. Cron is fixed UTC and does not adjust for daylight saving.
    #   AEDT (UTC+11, ~Oct-Apr): '0 7 * * *'  -> 6:00pm AEDT
    #   AEST (UTC+10, ~Apr-Oct): '0 8 * * *'  -> 6:00pm AEST
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install espn_api
        run: pip install espn_api

      - name: Run export script
        env:
          LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          YEAR: ${{ secrets.ESPN_YEAR }}
          SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: |
          python export_league_data.py \
            --league-id "$LEAGUE_ID" \
            --year "$YEAR" \
            --swid "$SWID" \
            --espn-s2 "$ESPN_S2" \
            > league.json

      - name: Commit updated data
        run: |
          git config user.name "league-data-bot"
          git config user.email "actions@github.com"
          git add league.json
          git diff --quiet --cached || git commit -m "Update league data $(date -u +'%Y-%m-%d')"
          git push
